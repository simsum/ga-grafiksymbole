name: ZIP als Release

# Baut bei Änderungen an den Symbolen ein ZIP mit allen Symbolen und hängt es an das Release "latest".
# Festes Downloadziel: https://github.com/<owner>/<repo>/releases/latest/download/ga-grafiksymbole.zip

on:
  push:
    branches: [main]
    paths:
      - "symbole/**"
      - "LICENSE"
      - "tools/zip_erstellen.py"
      - ".github/workflows/zip.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zip
  cancel-in-progress: false

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/zip_erstellen.py
      - name: Release "latest" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/ga-grafiksymbole.zip \
            --target "$GITHUB_SHA" \
            --title "Alle Symbole (aktueller Stand)" \
            --notes "Alle Symbole mit Verzeichnisstruktur (symbole/…) und Lizenz als ZIP, Stand Commit ${GITHUB_SHA::7}. Wird bei jeder Änderung an symbole/ automatisch neu gebaut."
