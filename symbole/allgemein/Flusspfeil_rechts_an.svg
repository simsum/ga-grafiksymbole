<svg xmlns="http://www.w3.org/2000/svg" width="24" height="14" viewBox="0 0 24 14">
  <!-- Flussrichtungspfeil fuer Rohrleitungen, animiert: helle Punkte laufen in Flussrichtung (SMIL); ohne Animation normaler Pfeil -->
  <g transform="">
    <path d="M2,5 L12,5 L12,1 L22,7 L12,13 L12,9 L2,9 Z" fill="#2A2A2A" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1" stroke-linejoin="round"/>
    <circle cx="3.5" cy="7" r="1.1" fill="#F2F2F2" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.75;1" dur="1.2s" begin="0s" repeatCount="indefinite"/><animate attributeName="cx" values="3.5;19" dur="1.2s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="3.5" cy="7" r="1.1" fill="#F2F2F2" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.75;1" dur="1.2s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="cx" values="3.5;19" dur="1.2s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="3.5" cy="7" r="1.1" fill="#F2F2F2" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.75;1" dur="1.2s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="cx" values="3.5;19" dur="1.2s" begin="0.8s" repeatCount="indefinite"/></circle>
  </g>
</svg>
