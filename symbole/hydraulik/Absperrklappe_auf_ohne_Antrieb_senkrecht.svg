  <!-- Gehaeuse zwischen Flanschen -->
  <rect x="4" y="9" width="42" height="12" fill="url(#gV)" stroke="#999999" stroke-width="2" stroke-linejoin="round"/>
  <rect x="1.5" y="3.5" width="4" height="23" rx="1" fill="url(#gV)" stroke="#999999" stroke-width="2"/>
  <rect x="44.5" y="3.5" width="4" height="23" rx="1" fill="url(#gV)" stroke="#999999" stroke-width="2"/>
  <circle cx="25" cy="15" r="10" fill="url(#gV)" stroke="#999999" stroke-width="2.4"/>
  <!-- Klappenscheibe -->
  <line x1="17" y1="15" x2="33" y2="15" stroke="#2EAA3A" stroke-width="3.2" stroke-linecap="round" transform="rotate(0 25 15)"/>
  <circle cx="25" cy="15" r="2" fill="#2EAA3A"/>
</g>
