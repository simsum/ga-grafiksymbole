<svg xmlns="http://www.w3.org/2000/svg" width="30" height="50" viewBox="0 0 30 50">
  <g transform="translate(0 50) rotate(-90)">
  <!-- Absperrklappe Wasser, Stellung: auf; Rohrachse x=15, senkrecht -->
