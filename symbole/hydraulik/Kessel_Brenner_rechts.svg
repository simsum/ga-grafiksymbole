<svg xmlns="http://www.w3.org/2000/svg" width="240" height="143" viewBox="0 27 240 143">
  <!-- Heizkessel mit Brenner rechts; Stutzen oben: VL x=110, RL x=70, Flansch-Oberkante y=5 (bezogen auf Bildoberkante) -->
  <defs>
  <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A3A3A3"/><stop offset="1" stop-color="#868686"/></linearGradient>
  <linearGradient id="gDoor" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4A5563"/><stop offset="1" stop-color="#3C4652"/></linearGradient>
  <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8392E"/><stop offset="1" stop-color="#B8231A"/></linearGradient>
  <linearGradient id="gAG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#555"/><stop offset="0.5" stop-color="#9A9A9A"/><stop offset="1" stop-color="#555"/></linearGradient>
  <linearGradient id="gNeck" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6A6A6A"/><stop offset="0.5" stop-color="#B5B5B5"/><stop offset="1" stop-color="#6A6A6A"/></linearGradient>
</defs>
  <g transform="translate(240,0) scale(-1,1)">
  <!-- Sockel -->
  <rect x="58" y="160" width="176" height="8" rx="1" fill="#5A5A5A"/>
  <!-- Kesselkoerper -->
  <rect x="80" y="42" width="154" height="118" rx="3" fill="url(#gBody)" stroke="#6A6A6A" stroke-width="1.5"/>
  <g stroke="#7A7A7A" stroke-width="1" opacity="0.8">
    <line x1="157" y1="64" x2="157" y2="160"/>
    <line x1="80" y1="64" x2="234" y2="64"/>
    <line x1="80" y1="112" x2="234" y2="112"/>
  </g>
  <!-- Regelung -->
  <rect x="90" y="47" width="52" height="13" rx="2" fill="#5E6670"/>
  <rect x="95" y="50" width="16" height="7" rx="1" fill="#C9D3DC"/>
  <circle cx="129" cy="53.5" r="2.5" fill="#C9D3DC"/><circle cx="136" cy="53.5" r="2.5" fill="#C9D3DC"/>
  <!-- Kesseltuer -->
  <rect x="58" y="38" width="24" height="122" rx="2" fill="url(#gDoor)" stroke="#3A434E" stroke-width="1.5"/>
  <line x1="83" y1="42" x2="83" y2="160" stroke="#C0392B" stroke-width="2.5"/>
  <!-- Brenner -->
  <rect x="50" y="98" width="9" height="30" rx="1" fill="#3A434E"/>
  <rect x="24" y="104" width="27" height="18" rx="3" fill="url(#gRed)" stroke="#8E1C14" stroke-width="1"/>
  <circle cx="22" cy="128" r="17" fill="url(#gRed)" stroke="#8E1C14" stroke-width="1"/>
  <circle cx="22" cy="128" r="10" fill="#4E565F"/>
  <circle cx="22" cy="128" r="3.5" fill="#C0392B"/>
  <!-- Stutzen -->
  <rect x="125.0" y="35" width="10" height="7" fill="url(#gNeck)"/>
    <rect x="121.0" y="31" width="18" height="4" rx="1" fill="#5E5E5E"/><rect x="165.0" y="35" width="10" height="7" fill="url(#gNeck)"/>
    <rect x="161.0" y="31" width="18" height="4" rx="1" fill="#5E5E5E"/>
  <rect x="204" y="30" width="16" height="12" fill="url(#gAG)"/>
  <rect x="201" y="27" width="22" height="4" rx="1" fill="#4A4A4A"/>
</g>
</svg>
