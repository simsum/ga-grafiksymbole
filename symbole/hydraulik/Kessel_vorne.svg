<svg xmlns="http://www.w3.org/2000/svg" width="140" height="143" viewBox="0 0 140 143">
  <!-- Heizkessel Ansicht von vorne; Flansche oben: VL x=42, RL x=98, Flansch-Oberkante y=4 -->
  <defs>
    <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#868686"/><stop offset="0.5" stop-color="#A3A3A3"/><stop offset="1" stop-color="#868686"/></linearGradient>
    <linearGradient id="gDoor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A5563"/><stop offset="1" stop-color="#3C4652"/></linearGradient>
    <radialGradient id="gRed" cx="0.45" cy="0.4" r="0.6"><stop offset="0" stop-color="#E8392E"/><stop offset="1" stop-color="#B8231A"/></radialGradient>
    <linearGradient id="gNeck" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6A6A6A"/><stop offset="0.5" stop-color="#B5B5B5"/><stop offset="1" stop-color="#6A6A6A"/></linearGradient>
    <linearGradient id="gAG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#555"/><stop offset="0.5" stop-color="#9A9A9A"/><stop offset="1" stop-color="#555"/></linearGradient>
  </defs>
  <!-- Abgasstutzen (hinten) -->
  <rect x="62" y="3" width="16" height="12" fill="url(#gAG)"/>
  <rect x="59" y="0" width="22" height="4" rx="1" fill="#4A4A4A"/>
  <!-- VL / RL Flansche -->
  <rect x="37" y="8" width="10" height="7" fill="url(#gNeck)"/><rect x="33" y="4" width="18" height="4" rx="1" fill="#5E5E5E"/>
  <rect x="93" y="8" width="10" height="7" fill="url(#gNeck)"/><rect x="89" y="4" width="18" height="4" rx="1" fill="#5E5E5E"/>
  <!-- Sockel -->
  <rect x="8" y="133" width="124" height="8" rx="1" fill="#5A5A5A"/>
  <!-- Kesselkoerper -->
  <rect x="10" y="15" width="120" height="118" rx="3" fill="url(#gBody)" stroke="#6A6A6A" stroke-width="1.5"/>
  <!-- Kesseltuer -->
  <rect x="17" y="18" width="106" height="112" rx="2" fill="url(#gDoor)" stroke="#3A434E" stroke-width="1.5"/>
  <g stroke="#C0392B" stroke-width="2.5"><line x1="15" y1="17" x2="15" y2="131"/><line x1="125" y1="17" x2="125" y2="131"/></g>
  <g fill="#2E3640"><circle cx="24" cy="25" r="2"/><circle cx="116" cy="25" r="2"/><circle cx="24" cy="123" r="2"/><circle cx="116" cy="123" r="2"/></g>
  <!-- Brenner von vorne -->
  <rect x="44" y="71" width="52" height="52" rx="2" fill="#333B45" stroke="#2A3139" stroke-width="1"/>
  <circle cx="70" cy="97" r="24" fill="url(#gRed)" stroke="#8E1C14" stroke-width="1"/>
  <circle cx="70" cy="97" r="14" fill="#4E565F"/>
  <circle cx="70" cy="97" r="5" fill="#C0392B"/>
