    <g fill="#4B50E6"><rect x="2" y="25" width="10" height="7" rx="2"/><rect x="2" y="58" width="10" height="7" rx="2"/></g>
    <!-- Gehaeuse -->
    <rect x="10" y="5" width="146" height="80" rx="4" fill="#FFFFFF" stroke="#4B50E6" stroke-width="3"/>
    <!-- Waermetauscher -->
    <rect x="18" y="14" width="26" height="62" rx="2" fill="#EEF0FF" stroke="#4B50E6" stroke-width="2"/>
    <g stroke="#4B50E6" stroke-width="1.2" opacity="0.5"><line x1="20" y1="16" x2="28" y2="74"/><line x1="25" y1="16" x2="33" y2="74"/><line x1="30" y1="16" x2="38" y2="74"/><line x1="35" y1="16" x2="43" y2="74"/></g>
    <!-- Radialventilatoren -->
    <g transform="translate(88,27)">
      <circle r="15" fill="#EEF0FF" stroke="#4B50E6" stroke-width="2"/>
      <g fill="none" stroke="#4B50E6" stroke-width="2" stroke-linecap="round"><path d="M0,-4 Q6,-7 4,-11" transform="rotate(0)"/><path d="M0,-4 Q6,-7 4,-11" transform="rotate(45)"/><path d="M0,-4 Q6,-7 4,-11" transform="rotate(90)"/><path d="M0,-4 Q6,-7 4,-11" transform="rotate(135)"/><path d="M0,-4 Q6,-7 4,-11" transform="rotate(180)"/><path d="M0,-4 Q6,-7 4,-11" transform="rotate(225)"/><path d="M0,-4 Q6,-7 4,-11" transform="rotate(270)"/><path d="M0,-4 Q6,-7 4,-11" transform="rotate(315)"/></g>
      <circle r="4" fill="#4B50E6"/>
    </g><g transform="translate(88,63)">
      <circle r="15" fill="#EEF0FF" stroke="#4B50E6" stroke-width="2"/>
      <g fill="none" stroke="#4B50E6" stroke-width="2" stroke-linecap="round"><path d="M0,-4 Q6,-7 4,-11" transform="rotate(0)"/><path d="M0,-4 Q6,-7 4,-11" transform="rotate(45)"/><path d="M0,-4 Q6,-7 4,-11" transform="rotate(90)"/><path d="M0,-4 Q6,-7 4,-11" transform="rotate(135)"/><path d="M0,-4 Q6,-7 4,-11" transform="rotate(180)"/><path d="M0,-4 Q6,-7 4,-11" transform="rotate(225)"/><path d="M0,-4 Q6,-7 4,-11" transform="rotate(270)"/><path d="M0,-4 Q6,-7 4,-11" transform="rotate(315)"/></g>
      <circle r="4" fill="#4B50E6"/>
    </g>
    <!-- Ausblasoeffnungen -->
    <g fill="#4B50E6"><rect x="150" y="13" width="6" height="28" rx="2"/><rect x="150" y="49" width="6" height="28" rx="2"/></g>
    <!-- Luftrichtung -->
    <path d="M114,45 L140,45 M133,38 L140,45 L133,52" fill="none" stroke="#4B50E6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
