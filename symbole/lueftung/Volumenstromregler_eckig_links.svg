<svg xmlns="http://www.w3.org/2000/svg" width="140" height="80" viewBox="0 0 140 80">
  <!-- Volumenstromregler eckig (Rechteckkanal, gegenlaeufige Lamellen, Kompaktregler), Luftrichtung links -->
  <g transform="translate(140,0) scale(-1,1)">
    <!-- Rechteckkanal mit Flanschen -->
    <rect x="10" y="27" width="120" height="46" fill="#FFFFFF" stroke="#4B50E6" stroke-width="3"/>
    <g stroke="#4B50E6" stroke-width="4" stroke-linecap="round"><line x1="10" y1="22" x2="10" y2="78"/><line x1="130" y1="22" x2="130" y2="78"/></g>
    <!-- Gegenlaeufige Regellamellen -->
    <g stroke="#4B50E6" stroke-width="3" stroke-linecap="round" fill="#4B50E6"><line x1="58" y1="39.5" x2="74" y2="32.5"/><circle cx="66" cy="36" r="2.5" stroke="none"/><line x1="58" y1="46.5" x2="74" y2="53.5"/><circle cx="66" cy="50" r="2.5" stroke="none"/><line x1="58" y1="67.5" x2="74" y2="60.5"/><circle cx="66" cy="64" r="2.5" stroke="none"/></g>
    <!-- Kompaktregler -->
    <line x1="66" y1="21" x2="66" y2="27" stroke="#4B50E6" stroke-width="3"/>
    <rect x="48" y="1" width="36" height="21" rx="3" fill="#4B50E6"/>
    <rect x="53" y="6" width="13" height="8" rx="1" fill="#FFFFFF"/>
    <circle cx="75" cy="11.5" r="4" fill="#FFFFFF"/>
    <!-- Luftrichtung -->
    <path d="M90,50 L118,50 M111,43 L118,50 L111,57" fill="none" stroke="#4B50E6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
