    <!-- DIP-Schalter Adresse / Parität -->
    <rect x="96" y="76" width="19" height="8" rx="1" fill="#e52a2a" stroke="#8c1418" stroke-width="0.7"/>
    <path d="M98.5 78v4M101 78v4M103.5 78v4M106 78v4M108.5 78v4M111 78v4M113.5 78v4" stroke="#fbe9e9" stroke-width="1.3"/>
    <rect x="80" y="80" width="11" height="7" rx="1" fill="#e52a2a" stroke="#8c1418" stroke-width="0.7"/>
    <path d="M82.5 82v3M85.5 82v3M88.5 82v3" stroke="#fbe9e9" stroke-width="1.3"/>
    <circle cx="74" cy="84" r="3.2" fill="#e4312b"/>

    <!-- Steckverbinder DO / DI -->
    <g fill="#eef1f2" stroke="#8f9aa2" stroke-width="0.7">
      <rect x="30" y="99" width="7" height="16" rx="1"/>
      <rect x="62" y="99" width="7" height="16" rx="1"/>
      <rect x="80" y="97" width="15" height="11" rx="1"/>
      <rect x="98" y="97" width="15" height="11" rx="1"/>
    </g>
    <g fill="#b9c2c8">
      <rect x="31.8" y="101" width="3.4" height="3" /><rect x="31.8" y="105.5" width="3.4" height="3"/><rect x="31.8" y="110" width="3.4" height="3"/>
      <rect x="63.8" y="101" width="3.4" height="3" /><rect x="63.8" y="105.5" width="3.4" height="3"/><rect x="63.8" y="110" width="3.4" height="3"/>
      <rect x="82" y="99" width="3" height="3"/><rect x="86" y="99" width="3" height="3"/><rect x="90" y="99" width="3" height="3"/>
      <rect x="82" y="103" width="3" height="3"/><rect x="86" y="103" width="3" height="3"/><rect x="90" y="103" width="3" height="3"/>
      <rect x="100" y="99" width="3" height="3"/><rect x="104" y="99" width="3" height="3"/><rect x="108" y="99" width="3" height="3"/>
      <rect x="100" y="103" width="3" height="3"/><rect x="104" y="103" width="3" height="3"/><rect x="108" y="103" width="3" height="3"/>
    </g>

    </g>

    <!-- Befestigungslaschen -->
    <g fill="#1a1f23" stroke="#080b0e" stroke-width="1">
      <rect x="42" y="134" width="30" height="12" rx="1.5"/>
      <rect x="88" y="134" width="30" height="12" rx="1.5"/>
    </g>
    <g fill="#080b0e">
      <circle cx="52" cy="140" r="2.2"/><circle cx="62" cy="140" r="1.6"/>
      <circle cx="98" cy="140" r="2.2"/><circle cx="108" cy="140" r="1.6"/>
    </g>
  </g>
  <g id="connection-anchors" fill="none" stroke="none">
    <circle id="anchor-left" cx="0" cy="83" r="1"/>
    <circle id="anchor-right" cx="160" cy="83" r="1"/>
    <circle id="anchor-top" cx="80" cy="0" r="1"/>
    <circle id="anchor-bottom" cx="80" cy="156" r="1"/>
  </g>
</svg>
